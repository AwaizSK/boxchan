name: Deploy TTS Bot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend (Vite)
        run: |
          export PATH="/home/jb/.nvm/versions/node/v22.23.0/bin:$PATH"
          cd frontend
          npm ci
          npm run build

      - name: Run Test Suite
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate tts-bot
          export PATH="/home/jb/.nvm/versions/node/v22.23.0/bin:$PATH"
          python -m unittest discover -s tests -v
          bash tests/test_deploy_validation.sh
          node tests/static_logic.js

      - name: Link Models Directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/models"
          if [ -d "/opt/tts-bot/models" ]; then
            cp -n /opt/tts-bot/models/*.onnx /opt/tts-bot/models/*.onnx.json "$GITHUB_WORKSPACE/models/" 2>/dev/null || true
          elif [ -d "/opt/workspace/boxchan/models" ]; then
            cp -n /opt/workspace/boxchan/models/*.onnx /opt/workspace/boxchan/models/*.onnx.json "$GITHUB_WORKSPACE/models/" 2>/dev/null || true
          fi

      - name: Deploy to /opt/tts-bot & Restart Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo /opt/workspace/boxchan/scripts/deploy.sh "$GITHUB_WORKSPACE"
