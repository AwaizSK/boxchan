<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TTS Bot</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main id="app">
  <form id="name-form" class="card" hidden>
    <h1>Who are you?</h1>
    <p id="name-msg" class="muted" role="alert"></p>
    <label>Your name (shown to other editors)<input id="name-input" type="text" maxlength="40" autocomplete="nickname"></label>
    <button type="submit" class="primary">Continue</button>
  </form>

  <div id="ui" hidden>
    <header>
      <div class="row top">
        <h1 id="title">Listen channel</h1>
        <span id="conn" class="conn" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="conn-text">Connecting…</span></span>
      </div>
      <div class="row">
        <select id="guild" aria-label="Server" hidden></select>
        <span id="meta" class="muted"></span>
        <button id="who" type="button" class="link" title="Change your name"></button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button id="tab-channel" type="button" role="tab" aria-selected="true" aria-controls="view-channel">Channel</button>
      <button id="tab-voice" type="button" role="tab" aria-selected="false" aria-controls="view-voice">Voice</button>
    </nav>

    <div id="view-channel" role="tabpanel" aria-labelledby="tab-channel">
      <section class="controls" aria-label="Playback controls">
        <button id="pause" type="button"></button>
        <button id="skip" type="button">Skip</button>
        <button id="clear" type="button">Clear queue</button>
        <span id="status" class="muted" role="status"></span>
      </section>

      <input id="search" type="search" placeholder="Search channels  ( / )" aria-label="Search channels" role="combobox" aria-expanded="true" aria-controls="list" autocomplete="off" spellcheck="false" autofocus>
      <ul id="list" role="listbox" tabindex="0" aria-label="Text channels"></ul>
      <p id="empty" class="muted" hidden>No channels match.</p>
    </div>

    <div id="view-voice" role="tabpanel" aria-labelledby="tab-voice" hidden>
      <section class="controls" aria-label="Voice controls">
        <button id="v-apply" type="button" class="primary">Apply</button>
        <button id="v-reset" type="button">Reset to default</button>
        <button id="v-rescan" type="button">Rescan</button>
        <span id="v-status" class="muted" role="status"></span>
      </section>
      <p id="v-warn" class="warn" hidden></p>
      <ul id="v-list" role="listbox" tabindex="0" aria-label="Voices"></ul>
      <p id="v-empty" class="muted" hidden>No voices found in the models folder.</p>
      <section class="say" aria-label="Test the voice">
        <input id="say-text" type="text" maxlength="200" value="Hello! This is how I sound." aria-label="Test phrase" autocomplete="off">
        <button id="say-btn" type="button">Say it</button>
        <span id="say-note" class="muted"></span>
      </section>
    </div>
  </div>
</main>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
