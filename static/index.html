<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TTS Bot</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main id="app">
<form id="login-form" class="card" hidden>
<h1>Sign in</h1>
<p id="login-msg" class="warn" role="alert"></p>
<label>Username<input id="login-user" type="text" autocomplete="username" required autofocus></label>
<label>Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
<button type="submit" class="primary">Sign in</button>
</form>
<form id="name-form" class="card" hidden>
<h1>Who are you?</h1>
<p id="name-msg" class="muted" role="alert"></p>
<label>Your name<input id="name-input" type="text" maxlength="40" autocomplete="nickname"></label>
<button type="submit" class="primary">Continue</button>
</form>
<div id="ui" hidden>
<header>
<div class="row top">
<h1 id="title">Listen channel</h1>
<span id="conn" class="conn" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="conn-text">Connecting…</span></span>
</div>
<div class="row">
<select id="guild" aria-label="Server" hidden></select>
<span id="meta" class="muted"></span>
<button id="who" type="button" class="link" title="Change your name"></button>
<button id="logout-btn" type="button" class="link" title="Sign out">Sign out</button>
</div>
</header>
<nav class="tabs" role="tablist" aria-label="Sections">
<button id="tab-channel" type="button" role="tab" aria-selected="true" aria-controls="view-channel">Channel</button>
<button id="tab-voice" type="button" role="tab" aria-selected="false" aria-controls="view-voice">Voice</button>
<button id="tab-messages" type="button" role="tab" aria-selected="false" aria-controls="view-messages">Messages</button>
<button id="tab-features" type="button" role="tab" aria-selected="false" aria-controls="view-features">Features</button>
<button id="tab-admin" type="button" role="tab" aria-selected="false" aria-controls="view-admin" hidden>Admin</button>
</nav>
<div id="view-channel" role="tabpanel" aria-labelledby="tab-channel">
<section class="controls" aria-label="Playback">
<button id="pause" type="button"></button>
<button id="skip" type="button">Skip</button>
<button id="clear" type="button">Clear queue</button>
<span id="status" class="muted" role="status"></span>
</section>
<input id="search" type="search" placeholder="Search channels ( / )" aria-label="Search channels" role="combobox" aria-expanded="true" aria-controls="list" autofocus>
<ul id="list" role="listbox" tabindex="0" aria-label="Text channels"></ul>
<p id="empty" class="muted" hidden>No channels match.</p>
</div>
<div id="view-voice" role="tabpanel" aria-labelledby="tab-voice" hidden>
<section class="controls" aria-label="Voice">
<button id="v-apply" type="button" class="primary">Apply</button>
<button id="v-reset" type="button">Reset to default</button>
<button id="v-rescan" type="button">Rescan</button>
<span id="v-status" class="muted" role="status"></span>
</section>
<p id="v-warn" class="warn" hidden>Saved voice is missing — using default</p>
<ul id="v-list" role="listbox" tabindex="0" aria-label="Voices"></ul>
<p id="v-empty" class="muted" hidden>No voices found in the models folder.</p>
<section class="say" aria-label="Test voice">
<input id="say-text" type="text" maxlength="200" value="Hello! This is how I sound." aria-label="Test phrase">
<button id="say-btn" type="button">Say it</button>
<span id="say-note" class="muted" role="status"></span>
</section>
</div>
<div id="view-messages" role="tabpanel" aria-labelledby="tab-messages" hidden>
<p id="m-dest" class="dest off" role="status"></p>
<section class="controls" aria-label="Presets">
<button id="m-preset-ready" type="button">Ready preset</button>
<button id="m-preset-clear" type="button">Clear</button>
</section>
<label for="m-text" class="visually">Message</label>
<textarea id="m-text" rows="5" placeholder="Write a message the bot will post. Ctrl+Enter sends." maxlength="2000"></textarea>
<div class="m-count"><span id="m-count" class="muted" aria-live="off">0/2000</span></div>
<section class="tagger" aria-label="Tag someone">
<input id="m-search" type="search" placeholder="Search members" aria-label="Search members" role="combobox" aria-expanded="true" aria-controls="m-list">
<ul id="m-list" role="listbox" aria-label="Members"></ul>
<p id="m-note" class="muted" hidden></p>
</section>
<div id="m-chips" class="chips" aria-label="Tagging"></div>
<div class="muted">Preview</div>
<div id="m-preview" class="preview" aria-label="Preview"></div>
<div class="sendrow">
<span id="m-ping" class="muted" role="status"></span>
<span id="m-why" class="muted"></span>
<button id="m-send" type="button" class="primary">Send</button>
</div>
</div>
<div id="view-features" role="tabpanel" aria-labelledby="tab-features" hidden>
<form id="f-form" class="f-form">
<label for="f-name" class="visually">Feature name</label>
<input id="f-name" type="text" placeholder="Feature name" maxlength="100" required>
<label for="f-desc" class="visually">Feature description</label>
<textarea id="f-desc" rows="3" placeholder="Describe feature request..." maxlength="1000" required></textarea>
<div class="row">
<button id="f-submit" type="submit" class="primary">Request feature</button>
<span id="f-msg" class="muted" role="status"></span>
</div>
</form>
<div id="f-list" class="f-list" role="feed" aria-label="Feature requests"></div>
<p id="f-empty" class="muted" hidden>No feature requests yet.</p>
</div>
<div id="view-admin" role="tabpanel" aria-labelledby="tab-admin" hidden>
<form id="u-form" class="f-form">
<label for="u-name" class="visually">Username</label>
<input id="u-name" type="text" placeholder="Username" maxlength="40" required>
<label for="u-pass" class="visually">Password</label>
<input id="u-pass" type="password" placeholder="Password (blank to keep)">
<label for="u-groups" class="visually">Groups</label>
<input id="u-groups" type="text" placeholder="Groups (e.g. admin, tester)">
<div class="row">
<button id="u-submit" type="submit" class="primary">Save user</button>
<span id="u-msg" class="muted" role="status"></span>
</div>
</form>
<div id="u-list" class="f-list" role="feed" aria-label="Users"></div>
<p id="u-empty" class="muted" hidden>No users found.</p>
</div>
</div>
</main>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
